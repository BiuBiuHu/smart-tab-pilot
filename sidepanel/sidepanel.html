<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smart Tab Pilot</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="panel">
    <header class="header">
      <div class="header-row">
        <div class="header-text">
          <h1>Smart Tab Pilot</h1>
          <p class="subtitle" data-i18n="subtitle">精确去重 · 任务导航图（规则出候选，模型判断同一任务）</p>
        </div>
        <button
          id="btn-settings"
          class="btn-settings"
          type="button"
          title="设置"
          aria-label="设置"
          data-i18n-title="settings"
          data-i18n-aria="settings"
          aria-pressed="false"
          aria-controls="settings-panel"
        >
          <svg class="btn-settings-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.16 7.16 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.81 8.48a.5.5 0 0 0 .12.64L4.96 10.7c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.69.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.06.24.26.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.26.12.55.02.69-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
            />
          </svg>
        </button>
      </div>
      <p id="panel-hint" class="panel-hint" data-i18n="panelHint">侧边栏面板 · 点击工具栏图标即可打开</p>
    </header>

    <section class="card settings-page" id="settings-panel" hidden>
      <div class="settings-page-head">
        <button
          id="btn-back-settings"
          class="btn-back-settings"
          type="button"
          title="返回任务视图"
          aria-label="返回任务视图"
          data-i18n="backToTasks"
          data-i18n-title="backToTasks"
          data-i18n-aria="backToTasks"
        >
          返回任务视图
        </button>
        <h2 class="settings-page-title" data-i18n="settingsPageTitle">设置</h2>
      </div>
        <section class="settings-block" id="language-section">
          <div class="card-title" data-i18n="languageTitle">界面语言</div>
          <div class="scope-toggle" role="radiogroup" aria-label="界面语言" data-i18n-aria="languageTitle">
            <label class="scope-option">
              <input type="radio" name="ui-locale" id="locale-auto" value="auto" checked />
              <span data-i18n="languageAuto">跟随浏览器</span>
            </label>
            <label class="scope-option">
              <input type="radio" name="ui-locale" id="locale-zh" value="zh" />
              <span data-i18n="languageZh">中文</span>
            </label>
            <label class="scope-option">
              <input type="radio" name="ui-locale" id="locale-en" value="en" />
              <span data-i18n="languageEn">English</span>
            </label>
          </div>
        </section>
        <section class="settings-block" id="nano-section">
          <div class="card-title" data-i18n="nanoTitle">Gemini Nano（内置 Prompt API）</div>
          <div class="status-row">
            <span class="label" data-i18n="nanoStatusLabel">状态</span>
            <span id="nano-status" class="badge badge-muted">检测中…</span>
          </div>
          <p id="nano-detail" class="hint"></p>
          <button id="btn-download-nano" class="btn btn-primary" hidden data-i18n="nanoDownloadBtn">
            下载 / 启用 Nano 模型
          </button>
        </section>
        <section class="settings-block">
          <div class="card-title" data-i18n="customTitle">自定义模型（OpenAI 兼容）</div>
          <p class="hint" data-i18n="customHint">当 Nano 不可用时使用。填写 Base URL、API Key、模型名。分类按页面主题，不会按网站域名合并标签组。</p>
          <label class="field">
            <span data-i18n="customBaseUrl">Base URL</span>
            <input type="url" id="custom-base-url" placeholder="https://api.openai.com/v1" autocomplete="off" />
          </label>
          <label class="field">
            <span data-i18n="customApiKey">API Key</span>
            <input type="password" id="custom-api-key" placeholder="sk-…" autocomplete="off" />
          </label>
          <label class="field">
            <span data-i18n="customModel">模型名</span>
            <input type="text" id="custom-model" placeholder="gpt-4o-mini" autocomplete="off" />
          </label>
          <button id="btn-save-custom" class="btn btn-secondary" data-i18n="customSave">保存自定义模型</button>
        </section>
        <section class="settings-block" id="feature-toggles">
          <div class="card-title" data-i18n="togglesTitle">功能开关</div>
          <label class="toggle">
            <input type="checkbox" id="toggle-dedupe" />
            <span data-i18n="toggleDedupe">精确 URL 去重跳转（含 path / query / hash）</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="toggle-auto-group" />
            <span data-i18n="toggleAutoGroup">自动按任务归组（模型判断是否同一任务；无模型时保守拆开）</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="toggle-quick-search" />
            <span data-i18n="toggleQuickSearch">启用快速搜索（P1，默认关闭）</span>
          </label>
        </section>
        <p id="fallback-hint" class="hint"></p>
    </section>

    <section class="card" id="task-view-card">
      <div class="card-title" data-i18n="taskViewTitle">任务视图</div>
      <div class="scope-toggle" role="radiogroup" aria-label="窗口范围" data-i18n-aria="scopeAria">
        <label class="scope-option">
          <input type="radio" name="win-scope" id="scope-all" value="all" checked />
          <span data-i18n="scopeAll">全部窗口</span>
        </label>
        <label class="scope-option">
          <input type="radio" name="win-scope" id="scope-current" value="current" />
          <span data-i18n="scopeCurrent">仅当前窗口</span>
        </label>
      </div>
      <div class="task-toolbar">
        <button id="btn-refresh-tasks" class="btn btn-secondary btn-inline" type="button" data-i18n="refresh">刷新</button>
        <button id="btn-group-now" class="btn btn-primary btn-inline" type="button" data-i18n="groupNow">立即整理任务</button>
      </div>
      <p id="task-empty" class="hint" data-i18n="taskLoading">正在加载任务…</p>
      <div id="task-clusters" class="task-clusters" hidden></div>
      <div id="group-progress" class="group-progress" hidden>
        <div class="group-progress-track">
          <div id="group-progress-fill" class="group-progress-fill"></div>
        </div>
        <p id="group-progress-text" class="hint">已处理 0/0</p>
      </div>
      <p id="action-result" class="hint result" aria-live="polite"></p>
    </section>

    <section class="card search-card" id="search-card" hidden>
      <div class="card-title">
        <span data-i18n="searchTitle">快速搜索</span>
        <span class="hint-inline" data-i18n="searchOptional">（可选 / 默认关闭）</span>
      </div>
      <div class="search-box">
        <input
          type="search"
          id="search-input"
          placeholder="搜索打开的标签 / 最近关闭…"
          data-i18n-placeholder="searchPlaceholder"
          data-i18n-aria="searchAria"
          autocomplete="off"
          spellcheck="false"
          aria-label="快速搜索"
          aria-controls="search-results"
        />
        <kbd class="shortcut-hint" title="也可在 chrome://extensions/shortcuts 修改" data-i18n-title="searchShortcutTitle">Ctrl/⌘⇧K</kbd>
      </div>
      <div id="search-results" class="search-results" role="listbox" aria-label="搜索结果" data-i18n-aria="searchResultsAria"></div>
      <p id="search-empty" class="hint search-empty" hidden>无匹配结果</p>
    </section>

    <footer class="footer"></footer>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
